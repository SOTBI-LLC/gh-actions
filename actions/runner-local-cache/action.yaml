name: Runner local cache
description: Restore or save a directory on the arc-runners shared PVC (/runner-cache) using rsync (if present) or portable tar pipe. No-op on GitHub-hosted runners. Self-contained, no extra binaries required on runner image.

inputs:
  path:
    description: Path under /runner-cache (e.g. yarn/my-org-my-repo-abc123)
    required: true
  target:
    description: Workspace path to sync (file or directory)
    required: true
  mode:
    description: restore or save
    required: true

runs:
  using: composite
  steps:
    - name: Runner local cache (${{ inputs.mode }})
      shell: bash
      env:
        CACHE_PATH: ${{ inputs.path }}
        TARGET: ${{ inputs.target }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail

        cache_root="/runner-cache"
        if [ ! -d "${cache_root}" ]; then
          echo "Local runner cache not mounted (${cache_root}); skipping."
          exit 0
        fi

        case "${MODE}" in
          restore|save) ;;
          *)
            echo "mode must be restore or save, got: ${MODE}" >&2
            exit 1
            ;;
        esac

        src="${cache_root}/${CACHE_PATH}"
        dst="${TARGET}"

        # Portable tree copy for directories.
        # - If rsync is available (future custom runner images), use it with --delete
        #   for fast incremental + exact mirror (no stale files from previous installs).
        # - Otherwise fall back to tar pipe (guaranteed on all Linux runner images,
        #   including stock ghcr.io/actions/actions-runner used by ARC; preserves
        #   symlinks, permissions, timestamps; streams without temp files).
        sync_dir() {
          local from="$1"
          local to="$2"
          if command -v rsync >/dev/null 2>&1; then
            mkdir -p "${to}"
            rsync -a --delete "${from}/" "${to}/"
          else
            rm -rf "${to}"
            mkdir -p "${to}"
            tar -C "${from}" -cf - . | tar -C "${to}" -xf -
          fi
        }

        if [ "${MODE}" = "restore" ]; then
          if [ ! -e "${src}" ]; then
            echo "Cache miss: ${src}"
            exit 0
          fi
          mkdir -p "$(dirname "${dst}")"
          if [ -d "${src}" ]; then
            sync_dir "${src}" "${dst}"
          else
            cp -a "${src}" "${dst}"
          fi
          echo "Restored ${src} -> ${dst}"
          exit 0
        fi

        if [ ! -e "${dst}" ]; then
          echo "Nothing to save at ${dst}"
          exit 0
        fi
        mkdir -p "$(dirname "${src}")"
        if [ -d "${dst}" ]; then
          sync_dir "${dst}" "${src}"
        else
          cp -a "${dst}" "${src}"
        fi
        echo "Saved ${dst} -> ${src}"
