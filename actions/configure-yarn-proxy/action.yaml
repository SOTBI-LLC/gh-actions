name: Configure Yarn/npm proxy
description: >
  Apply HTTP_PROXY / HTTPS_PROXY to Yarn 1.x and npm. Required on self-hosted
  arc-runners where egress goes through Xray; NODE_USE_ENV_PROXY alone is not enough
  for yarn install. No-op when HTTP_PROXY is unset (e.g. ubuntu-latest).

runs:
  using: composite
  steps:
    - name: Configure Yarn/npm proxy
      shell: bash
      run: |
        set -euo pipefail

        proxy="${HTTP_PROXY:-${http_proxy:-}}"
        if [ -z "${proxy}" ]; then
          echo "HTTP_PROXY not set; skipping Yarn/npm proxy configuration."
          exit 0
        fi

        https_proxy="${HTTPS_PROXY:-${https_proxy:-$proxy}}"

        # Yarn 1.x does not reliably honor HTTP_PROXY; set .yarnrc explicitly.
        yarn config set proxy "${proxy}"
        yarn config set https-proxy "${https_proxy}"
        yarn config set network-timeout 600000

        npm config set proxy "${proxy}"
        npm config set https-proxy "${https_proxy}"

        echo "Configured Yarn/npm to use proxy: ${proxy}"
