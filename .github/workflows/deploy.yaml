name: Lint, Test, Build & push image
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses:  SOTBI-LLC/gh-actions/.github/workflows/go-lint.yaml@main
    secrets: inherit

  test:
    name: Test
    uses: SOTBI-LLC/gh-actions/.github/workflows/go-test.yaml@main
    secrets: inherit

  build:
    name: build & push image
    needs:
      - lint
      - test
    uses: SOTBI-LLC/gh-actions/.github/workflows/build-image.yaml@main
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.sha || github.ref_name}}
