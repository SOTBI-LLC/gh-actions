name: Lint

on:
  workflow_call:
    secrets:
      TELEGRAM_CHANNEL:
        required: true
      TELEGRAM_TOKEN:
        required: true
      REGISTRY_URL:
        required: true
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: arc-runners
    timeout-minutes: 40
    # Self-hosted runners use HTTP_PROXY (Xray); Node 24 needs this for corepack/fetch.
    env:
      NODE_USE_ENV_PROXY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Yarn/npm proxy
        if: contains(runner.labels, 'arc-runners')
        uses: SOTBI-LLC/gh-actions/actions/configure-yarn-proxy@main

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Restore node_modules (local runner cache)
        uses: SOTBI-LLC/gh-actions/actions/runner-local-cache@main
        with:
          path: node-modules/${{ hashFiles('yarn.lock') }}
          target: node_modules
          mode: restore

      - name: Restore yarn cache (local runner cache)
        uses: SOTBI-LLC/gh-actions/actions/runner-local-cache@main
        with:
          path: yarn/${{ hashFiles('**/yarn.lock') }}
          target: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          mode: restore

      - name: Configure npm authentication
        run: |
          cat > ".npmrc" << EOF
          @sotbi:registry=https://${{ secrets.REGISTRY_URL }}
          //${{ secrets.REGISTRY_URL }}/:_authToken=${{ secrets.NPM_TOKEN }}
          always-auth=true
          EOF

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Save node_modules (local runner cache)
        if: success()
        uses: SOTBI-LLC/gh-actions/actions/runner-local-cache@main
        with:
          path: node-modules/${{ hashFiles('yarn.lock') }}
          target: node_modules
          mode: save

      - name: Save yarn cache (local runner cache)
        if: success()
        uses: SOTBI-LLC/gh-actions/actions/runner-local-cache@main
        with:
          path: yarn/${{ hashFiles('**/yarn.lock') }}
          target: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          mode: save

      - name: Run ESLint
        run: yarn lint

      - name: Send telegram message on lint failed
        if: failure()
        uses: SOTBI-LLC/gh-actions/actions/notify-telegram@main
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            🔍PR #${{github.event.number}}:
            ❗️Linting failed❗️
            👷: ${{ github.triggering_actor }}
            👀 changes: https://github.com/${{ github.repository }}/pull/${{github.event.number}}
