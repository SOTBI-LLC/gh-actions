name: Test

on:
  workflow_call:
    secrets:
      TELEGRAM_CHANNEL:
        required: true
      TELEGRAM_TOKEN:
        required: true
      REGISTRY_URL:
        required: true
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v5
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Configure npm authentication
        run: |
          cat > ".npmrc" << EOF
          @sotbi:registry=https://${{ secrets.REGISTRY_URL }}
          //${{ secrets.REGISTRY_URL }}/:_authToken=${{ secrets.NPM_TOKEN }}
          always-auth=true
          EOF

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Test
        run: yarn test --watch=false --configuration=ci

      - name: Send telegram message on test failed
        if: failure()
        uses: SOTBI-LLC/gh-actions/actions/notify-telegram@main
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            🔍PR #${{github.event.number}}:
            ❗️Testing failed❗️
            👷: ${{ github.triggering_actor }}
            👀 changes: https://github.com/${{ github.repository }}/pull/${{github.event.number}}
