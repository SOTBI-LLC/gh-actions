name: Build image
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
    secrets:
      TELEGRAM_CHANNEL:
        required: true
      TELEGRAM_TOKEN:
        required: true
      REGISTRY_URL:
        required: false
      NPM_TOKEN:
        required: false
      RELEASEBOT_URL:
        required: false
      RELEASEBOT_SHARED_SECRET:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Building image
    timeout-minutes: 40
    runs-on: arc-runners
    env:
      NODE_USE_ENV_PROXY: "1"
      # Shared PVC on arc-runners (see local-k8s kubernetes/apps/arc-runners).
      BUILDX_CACHE_DIR: /runner-cache/buildx/${{ github.repository }}
    steps:
      - name: Set ghcr image ref (lowercase)
        run: |
          echo "IMAGE_REF_LOWER=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure npm authentication
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          if [ -z "${REGISTRY_URL}" ]; then
            echo "Skipping npm authentication (REGISTRY_URL not set)"
            exit 0
          fi
          {
            echo "@sotbi:registry=https://${REGISTRY_URL}"
            echo "//${REGISTRY_URL}/:_authToken=${{ secrets.NPM_TOKEN }}"
            echo "always-auth=true"
          } > ".npmrc"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_REF_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{tag}}
            type=semver,pattern={{raw}}
            type=raw,value=${{ inputs.tag }}
            type=raw,latest
      - name: Prepare local Buildx cache directory
        if: contains(runner.labels, 'arc-runners')
        run: mkdir -p "${BUILDX_CACHE_DIR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # Default docker driver uses DinD (DOCKER_HOST). Do not use driver: kubernetes —
        # buildkit would run in a separate pod without /runner-cache.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          cache-from: |
            type=local,src=${{ env.BUILDX_CACHE_DIR }}
            type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache
          cache-to: |
            type=local,dest=${{ env.BUILDX_CACHE_DIR }},mode=max
            type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Send telegram message on fail image was built
        if: failure()
        uses: SOTBI-LLC/gh-actions/actions/notify-telegram@main
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            ⛔ Failure building image started by ${{ github.actor }}.
            🌴: ${{ github.head_ref || github.ref_name }}
            🔖: ${{ steps.meta.outputs.tags }}
            👀 changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            📋: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Get and trim commit message
        id: commit_message
        shell: bash
        run: |
          set -euo pipefail

          # Safely read the commit message (subject + body) without breaking bash quoting.
          COMMIT_MSG="$(git log -1 --pretty=%B)"

          COMMIT_MSG_SINGLE_LINE="$(printf '%s' "$COMMIT_MSG" | tr '\n' ' ' | tr -s ' ')"
          TRIMMED_MSG="${COMMIT_MSG_SINGLE_LINE:0:512}"

          # Use a unique delimiter to avoid conflicts with commit content.
          DELIM="EOF_${RANDOM}_${RANDOM}"
          {
            echo "trimmed_message<<$DELIM"
            echo "$TRIMMED_MSG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - name: Check release bot configuration
        id: releasebot_config
        shell: bash
        env:
          RELEASEBOT_URL: ${{ secrets.RELEASEBOT_URL }}
          RELEASEBOT_SHARED_SECRET: ${{ secrets.RELEASEBOT_SHARED_SECRET }}
        run: |
          if [ -n "${RELEASEBOT_URL}" ] && [ -n "${RELEASEBOT_SHARED_SECRET}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Send build notification to release bot
        id: releasebot
        if: ${{ success() && steps.releasebot_config.outputs.enabled == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          RELEASEBOT_URL: ${{ secrets.RELEASEBOT_URL }}
          RELEASEBOT_SHARED_SECRET: ${{ secrets.RELEASEBOT_SHARED_SECRET }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TAG: ${{ inputs.tag }}
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.trimmed_message }}
        run: |
          set -euo pipefail

          endpoint="${RELEASEBOT_URL%/}/build-notifications"
          payload_file="$(mktemp)"

          python3 - <<'PY' > "${payload_file}"
          import json
          import os

          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "branch": os.environ["BRANCH"],
              "sha": os.environ["GITHUB_SHA"],
              "tag": os.environ["TAG"],
              "actor": os.environ["GITHUB_ACTOR"],
              "commit_message": os.environ["COMMIT_MESSAGE"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            --request POST "${endpoint}" \
            --header "Content-Type: application/json" \
            --header "X-Releasebot-Secret: ${RELEASEBOT_SHARED_SECRET}" \
            --data @"${payload_file}"
      - name: Send telegram message after image was built
        if: ${{ success() && (steps.releasebot_config.outputs.enabled != 'true' || steps.releasebot.outcome == 'failure') }}
        uses: SOTBI-LLC/gh-actions/actions/notify-telegram@main
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            🏗️: ${{ github.actor }} built image.
            💬: ${{ steps.commit_message.outputs.trimmed_message }}
            🌴: ${{ github.head_ref || github.ref_name }}
            🔖: ${{ steps.meta.outputs.tags }}
            🏷️: ${{ steps.meta.outputs.labels }}
            👀 changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            📋: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
