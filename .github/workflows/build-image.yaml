name: Build image
on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string
  workflow_dispatch:

env:
  branch: ${{ github.head_ref || github.ref_name }}

jobs:
  build-image:
    name: Building image
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Set ghcr image ref (lowercase)
        run: |
          echo "IMAGE_REF_LOWER=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_REF_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{tag}}
            type=semver,pattern={{raw}}
            type=raw,value=${{ inputs.tag }}
            type=raw,latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # with:
        #   driver: kubernetes
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache
            type=gha
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_REF_LOWER }}:buildcache,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Send telegram message on fail image was built
        if: failure()
        uses: ./.github/actions/notify-telegram
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            ⛔ Failure building image started by ${{ github.actor }}.
            Used 🌴: ${{ env.branch }}
            Used tag: ${{ steps.meta.outputs.tags }}
            👀 changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            View job logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Get and trim commit message
        id: commit_message
        shell: bash
        run: |
          set -euo pipefail

          # Safely read the commit message (subject + body) without breaking bash quoting.
          COMMIT_MSG="$(git log -1 --pretty=%B)"

          COMMIT_MSG_SINGLE_LINE="$(printf '%s' "$COMMIT_MSG" | tr '\n' ' ' | tr -s ' ')"
          TRIMMED_MSG="${COMMIT_MSG_SINGLE_LINE:0:512}"

          # Use a unique delimiter to avoid conflicts with commit content.
          DELIM="EOF_${RANDOM}_${RANDOM}"
          {
            echo "trimmed_message<<$DELIM"
            echo "$TRIMMED_MSG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
      - name: Send telegram message after image was built
        uses: ./.github/actions/notify-telegram
        with:
          chat_id: ${{ secrets.TELEGRAM_CHANNEL }}
          bot_token: ${{ secrets.TELEGRAM_TOKEN }}
          text: |
            ${{ github.actor }} built image.
            ${{ steps.commit_message.outputs.trimmed_message }}
            Used branch: ${{ env.branch }}
            Used tag: ${{ steps.meta.outputs.tags }}
            Used labels: ${{ steps.meta.outputs.labels }}
            👀 changes: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            View job logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
